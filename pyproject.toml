[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# The V3 surface is small enough to hold a stricter rule set than V2 could:
# I (import sort), UP (pyupgrade) and B (bugbear) are on from the start, rather
# than deferred behind ~400 pre-existing findings the way they were on V2.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by `line-length`, not worth hard-failing on

[tool.ruff.lint.isort]
known-first-party = ["shared", "backtesting", "research"]
