# Swing model configuration — semiconductor watchlist, SMH benchmark, all thresholds
# Single source of truth for strategy-level settings. Change thresholds here, not in code.

watchlist:
  # Legacy flat keys — kept for backward compatibility with call sites not yet
  # migrated to sector_config.py's helpers (fundamental_layer.py, run_swing_model.py,
  # paper_runner.py, news_layer.py read these directly via cfg.get("watchlist", {}).
  # get("tickers", [...])). Mirrors watchlist.sectors.semiconductors exactly — do
  # not let these drift out of sync until every consumer is migrated (see
  # shared/utils/sector_config.py and CHANGELOG.md's multi-sector expansion entries).
  tickers:
    - NVDA
    - AMD
    - AVGO
    - TSM
    - MU
    - ASML
  benchmark: SMH                   # Sector ETF for relative-strength comparison
  benchmark_alt: SOXX

  # Sector-grouped structure — shared/utils/sector_config.py reads this as the
  # source of truth going forward. Backtest-validated in CHANGELOG.md
  # v2.2.6/v2.2.7 (data/historical_banks/, gitignored research dataset);
  # activated for PAPER TRADING ONLY in v2.2.10 — no real capital is at risk
  # for either sector (see Performance Thresholds — nothing is eligible to go
  # live with real money regardless of this flag).
  sectors:
    semiconductors:
      active: true
      benchmark: SMH
      benchmark_alt: SOXX
      tickers:
        - NVDA
        - AMD
        - AVGO
        - TSM
        - MU
        - ASML
      # Not part of the tradeable watchlist — these 4 hyperscalers' own SEC
      # filings are checked as a sector-wide capex demand signal (see v2.2.27
      # CHANGELOG entry): AI infrastructure capex guidance from AMZN/MSFT/
      # GOOGL/META is the demand driver behind semiconductor sector moves,
      # and it shows up in their own 8-Ks before it reaches general news.
      capex_context_tickers:
        - AMZN
        - MSFT
        - GOOGL
        - META
    regional_banks:
      active: true                # paper trading only — see v2.2.10 CHANGELOG entry
      benchmark: KRE
      benchmark_alt: null
      tickers:
        - ZION
        - KEY
        - HBAN
        - RF
        - FITB
    healthcare:
      active: true                # paper trading only — see v2.2.24 CHANGELOG entry
      benchmark: XLV
      benchmark_alt: null
      tickers:
        - LLY
        - PFE
        - MRK
        - ABBV
        - UNH
        - JNJ
    consumer_discretionary:
      active: true                # paper trading only — chosen to exercise all 5 scoring
      benchmark: XLY               # layers strongly (heavy options/analyst coverage, high
      benchmark_alt: XRT           # StockTwits volume, earnings-driven fundamentals) —
      tickers:                     # see CHANGELOG multi-sector expansion entries.
        - AMZN
        - TSLA
        - HD
        - NKE
        - SBUX
        - TGT

# Geopolitical risk tickers — apply fixed confidence penalty in alerts
geopolitical_risk_tickers:
  - TSM
  - ASML
geopolitical_penalty: -5

# Holding period
holding_period:
  min_days: 1
  max_days: 15

# Confidence thresholds
confidence:
  min_threshold: 90                # No trade surfaced below this final score
  sensitivity_thresholds:          # For --sensitivity backtest run
    - 85
    - 87
    - 90
    - 92
    - 95

# Bearish/breakdown signal detection — kill switch, same pattern as
# feedback_loop.sector_calibration_enabled below. scoring.py::determine_direction()
# only returns "bearish" for live/paper trading when this is explicitly true;
# backtesting/calibration bypass this flag to validate the bearish path
# regardless of the live default.
#
# Turned on 2026-08-19 (paper trading only — no real capital) by explicit user
# decision, made with full knowledge that the backtest does NOT clear the
# go-live gate in any sector (see CHANGELOG v2.2.58 and its follow-up
# research entry): every bearish backtest bucket scored a negative Sharpe
# across three independent rounds of tuning. The goal of turning this on
# anyway is to start accumulating real bearish paper-trade outcomes — the one
# lever backtesting against fixed historical data can't provide — not a claim
# that the bearish path is fit to trade. Revert to false to go back to
# bullish-only live/paper behavior at any time.
enable_bearish_signals: true

# Bearish entry style — backtesting-only research toggle (see
# backtesting/simulation.py's _simulate_test_signals docstring and
# backtesting/bearish_capitulation_fade_sweep.py). "continuation" (current,
# unchanged default) shorts the breakdown bar itself, mirroring the bullish
# breakout entry. "capitulation_fade" is an experimental alternative added
# 2026-08-19: instead of shorting the fresh breakdown, it waits for the
# relief bounce that typically follows and shorts that bounce's exhaustion —
# CHANGELOG v2.2.58/59's working theory is that shorting a fresh breakdown
# lands too close to where a squeeze/reversal is likeliest, unlike the
# bullish case. NOT wired into live/paper scoring (scoring.py's
# determine_direction() has no notion of entry "style" — this only affects
# which bars backtesting/simulation.py treats as bearish candidates), and no
# live pathway reads this key yet. See CHANGELOG for the backtest comparison
# before ever wiring this live.
bearish_entry_style: continuation

# Scoring weights (max contribution per category — must sum to 100)
scoring_weights:
  technical_max: 40         # Updated from 50
  positioning_max: 20       # New — Market Positioning (options, institutional, short interest, insider, analyst)
  sentiment_max: 15         # Updated from 20 (Reddit removed; StockTwits + Seeking Alpha)
  news_max: 15              # Unchanged
  fundamental_max: 10       # Updated from 15 (contribution scale; FundamentalScorer's internal
                            # scale stays -15..+15, rescaled by scoring.py)

# Technical sub-signal max points (5 sub-signals × 8 = 40)
technical_sub_signals:
  breakout: 8               # Updated from 10
  trend: 8                  # Updated from 10
  relative_strength: 8      # Updated from 10
  rsi: 8                    # Updated from 10
  volume_profile: 8         # Updated from 10

# Market Positioning sub-signal max points (sum = 20)
positioning_sub_signals:
  options_positioning: 6    # Put/call ratio + IV skew
  institutional_ownership: 5
  short_interest: 4
  insider_transactions: 3
  analyst_rating_trend: 2

# Sentiment sub-signal max points (sum = 15) — StockTwits + Seeking Alpha engagement proxy
sentiment_sub_signals:
  stocktwits_ratio: 7       # Bullish/bearish ratio, z-scored vs. own history
  stocktwits_velocity: 5    # Sentiment/volume velocity (native sentiment_change/volume_change fields)
  seeking_alpha_engagement: 3  # commentCount velocity — weak engagement proxy, not true sentiment

# News sub-signal max points (sum = 15)
news_sub_signals:
  credibility_weighted: 6
  theme_alignment: 4
  clustering: 3
  decay_factor: 2

# Modifier bounds (applied after base score; final clamped 0-100)
modifier_bounds:
  regime:
    min: -15
    max: 10
  sector_rotation:
    min: -15
    max: 5
  earnings_proximity:
    min: -20
    max: 0
  cross_ticker:
    min: -10
    max: 5
  seasonality:
    min: -5
    max: 5
  macro_overlay:
    min: -10
    max: 3

# Modifier values (specific conditions)
modifiers:
  regime:
    trending_up_breakout_boost: 10      # breakout/momentum weights +10%
    trending_up_mean_reversion_penalty: -10
    choppy_breakout_penalty: -15
    choppy_rsi_boost: 10
    high_vol_score_cap: 70             # all scores capped at 70 in high-vol regime
  sector_rotation:
    outflow_penalty: -15
    # inflow_boost was +5 until modifier_calibration_diagnostic.py was run
    # against real backtest replay for the first time (sector_rotation was
    # wired into backtesting/simulation.py from a hardcoded 0.0 — previously
    # unvalidated by any data source). 544 pooled outcomes: sector-neutral
    # trades won 63.7% (n=157) vs. sector-inflow trades at 53.9% (n=358) —
    # inflow did NOT outperform neutral, so rewarding confidence for it isn't
    # supported. outflow_penalty stays at -15: outflow trades won 44.8%
    # (n=29, wide CI given the small sample, but not contradicted).
    inflow_boost: 0
  earnings:
    within_5_days_penalty: -20
    within_6_to_18_days_penalty: -5
    post_earnings_settling_penalty: -5   # 1-3 days after earnings — IV still settling
    beyond_18_days: 0
  cross_ticker:
    # Dampened to 0 (was -10, but a config/code key mismatch meant this value
    # was never actually applied — the code always used a hardcoded -5.0
    # instead, see cross_ticker_analysis.py). Now that the mismatch is fixed,
    # set to 0 rather than -10 or the old -5 default: regime and sector_rotation
    # modifiers already penalize sector-wide SMH weakness through their own
    # channels, so a sector-wide cross_ticker penalty on top of those two would
    # triple-count one underlying signal. divergence_boost/underperforming stay
    # active since those reflect genuine ticker-specific information the other
    # two modifiers can't see.
    sector_wide_discount: 0
    divergence_boost: 5
  # Insider activity is scored as a Market Positioning sub-signal (see
  # positioning_sub_signals.insider_transactions), not a standalone modifier —
  # keeping both would double-count the same Form 4 data.
  seasonality:
    strong_period_boost: 5            # e.g., Q4
    weak_period_penalty: -5           # e.g., post-Q1 (Jan-Feb)
    # Monthly modifiers. Signs flipped 2026-08-15 (see CHANGELOG): the original
    # "Phase 12 backtesting" calibration comment (kept for history — see below)
    # turned out to be a hypothesis, not a real calibration lineage. Measured
    # against real sector-pure semiconductor outcomes (backtesting/
    # modifier_calibration_diagnostic.py, after fixing the sector-scoping bug
    # that had been diluting this same read with irrelevant non-semiconductor
    # bars): the original sign was backwards — "seasonally strong" months won
    # 38.9% (n=72), "seasonally weak" months won 70.7% (n=82). Plausible
    # mechanism, not asserted as fact: a breakout during a widely-anticipated
    # strong month is a crowded, lower-conviction trade, while one during an
    # out-of-favor month is a stronger signal precisely because it's against
    # the grain. Magnitudes are the pre-existing ones with sign flipped, not
    # independently re-derived per month — a real per-month calibration is a
    # separate, larger follow-up.
    monthly_modifiers:
      1: 5     # January
      2: 5     # February
      3: 0
      4: -2
      5: 0
      6: 0
      7: 0
      8: 0
      9: 2     # September
      10: -3   # October
      11: -5   # November
      12: -5   # December
  macro_overlay:
    adverse_penalty: -10
    adverse_max_confidence: 92        # only 92+ surfaced in adverse macro
    favorable_boost: 3
    # Thresholds for macro signals (Clarification 2 free proxies). Key names and
    # units (fractional, not whole-percent) must match what macro_overlay.py's
    # compute_macro_state() actually reads (tnx_adverse_threshold_pct etc.) —
    # this block previously had only `tnx_rise_threshold_pct: 3.0`, which the
    # code never reads (wrong key name) and wouldn't have worked even renamed
    # (wrong scale: _period_pct_change returns 0.03 for a 3% move, not 3.0).
    # Values below match the hardcoded fallback defaults exactly, so this is a
    # wiring fix, not a threshold change — dxy/china thresholds weren't in
    # config at all before this.
    tnx_adverse_threshold_pct: 0.03    # 3% TNX rise over the lookback = hawkish proxy
    tnx_favorable_threshold_pct: -0.03
    dxy_adverse_threshold_pct: 0.02    # 2% DXY rise over the lookback = adverse (TSM/ASML FX)
    dxy_favorable_threshold_pct: -0.02
    china_keyword_adverse_threshold: 5
    tnx_lookback_days: 20
    dxy_lookback_days: 20
    china_keyword_lookback_days: 5
    china_keywords:
      - "export restriction"
      - "chip ban"
      - "China tariff"
      - "Taiwan Strait"
      - "semiconductor embargo"

# Risk/Reward (entry zone formula)
risk_reward:
  entry_zone_half_width_atr: 0.25     # Entry zone = breakout_level ± (0.25 × ATR_14)
  stop_atr_multiplier: 2.0            # Stop = entry_zone_lower - (2.0 × ATR_14)
  min_rr_ratio: 3.0                   # 1:3 minimum R:R required
  atr_period: 14
  breakout_lookback: 20               # 20-day rolling high as breakout level
  trailing_stop_atr_multiplier: 1.5   # Trailing stop trails at 1.5x ATR below highest close

# Position sizing (confidence-scaled fixed fractional)
position_sizing:
  tiers:
    - min_score: 90
      max_score: 92
      risk_pct: 0.010
    - min_score: 93
      max_score: 95
      risk_pct: 0.015
    - min_score: 96
      max_score: 98
      risk_pct: 0.020
    - min_score: 99
      max_score: 100
      risk_pct: 0.025
  max_capital_pct: 0.05               # 5% of account max per trade ($750 at $15k)
  starting_capital: 15000

# Circuit breakers (drawdown from peak equity)
circuit_breakers:
  yellow:
    drawdown_pct: 0.05               # 5% drawdown from peak
    position_size_multiplier: 0.5
    min_confidence_override: 95
  orange:
    drawdown_pct: 0.10               # 10% drawdown from peak
    no_new_positions: true
    pause_days: 5
  red:
    drawdown_pct: 0.15               # 15% drawdown from peak
    full_stop: true
  consecutive_loss:
    at_2: { size_multiplier: 0.5 }
    at_3: { pause_days: 3 }
    at_4: { full_pause: true }

# Portfolio construction
portfolio:
  max_simultaneous_risk_pct: 0.03    # 3% of account max across all open positions —
                                      # dollar-risk backstop, independent of position count
  # max_total_open_positions is a secondary safety ceiling = sum of active sectors'
  # max_open_positions (2+2+2+2=8 with all four sectors active — see v2.2.24
  # CHANGELOG entry for healthcare's activation and the consumer_discretionary
  # addition that followed it; each sector's own cap of 2 remains the binding
  # constraint per-sector regardless of this total).
  max_total_open_positions: 8
  sectors:
    semiconductors:
      max_open_positions: 2
      # Each inner list is a correlated group — at most 1 same-direction open
      # position from any single group at a time. Generalized from the old
      # 2-element correlated_pair_tickers to support the regional_banks
      # sector's larger group below (portfolio_manager.py's correlated-group
      # check already handles groups of any size, not just pairs).
      correlated_groups:
        - [NVDA, AMD]
        - [NVDA, AVGO]
        - [AMD, AVGO]
        - [MU, NVDA]
        - [TSM, NVDA]
        - [TSM, ASML]
    regional_banks:
      max_open_positions: 2
      correlated_groups:
        - [ZION, KEY, HBAN, RF, FITB]
    healthcare:
      max_open_positions: 2
      correlated_groups:
        - [LLY, PFE, MRK, ABBV, UNH, JNJ]
    consumer_discretionary:
      max_open_positions: 2
      correlated_groups:
        - [AMZN, TSLA]   # mega-cap growth pair — high beta, share macro/rate sensitivity
        - [HD, TGT]      # big-box retail — same-store-sales/consumer-spending correlated

# PDT tracking
pdt:
  max_day_trades_per_5_days: 3

# Options account level
options_approval_level: 2           # 1=covered/cash-secured, 2=debit spreads, 3=naked/complex

# Greeks filter (trade_selector.py Filter 4) — bounds on a structure's own
# capital-at-risk, so a small and a large defined-risk spread are held to the
# same relative standard. Only applied to structures with a resolvable
# options-only leg composition and when a real option chain was fetched (see
# swing_model/trade_selector.py's _GREEKS_RESOLVABLE_LEGS and module docstring).
greeks_filter:
  min_dte: 5                          # skip 0DTE/weekly expirations when building the chain
  max_daily_theta_pct_of_capital: 0.05   # reject if time decay alone burns >5%/day of capital at risk
  max_vega_pct_of_capital: 0.15          # reject if a 1% IV move would swing P&L >15% of capital at risk

# Trade management profit targets
profit_targets:
  vertical_debit_spreads: 0.60
  calendar_diagonal: 0.50
  long_call_put_leaps: 0.60
  vertical_credit_spreads: 0.50
  cash_secured_put: 0.75
  covered_call: 0.80
  iron_condor_butterfly: 0.50
  long_butterfly: 0.60
  long_straddle_strangle_one_side: 1.00
  structure_stop_debit_spread_pct: 0.50  # Close if spread loses 50% of value

# Data validation thresholds
data_validation:
  max_price_gap_days: 3
  max_single_day_move_pct: 0.50      # >50% likely a split or data error
  sentiment_ratio_min: 0.0
  sentiment_ratio_max: 1.0

# Alpha Vantage call budget (used by app_ui/scan_worker.py's pre-scan budget
# projection; actual enforcement is news_client.py's own daily counter).
alpha_vantage_budget:
  # AV news is now a confirmation-only call (v2.2.21) — it only fires when
  # Yahoo/Finnhub/Seeking Alpha already flagged a critical event for a ticker,
  # on any scan type, not a guaranteed 1-call-per-ticker post-close sweep like
  # before. Real usage no longer scales directly with ticker count (23 across
  # four sectors today), so these are rough estimates for the UI's budget
  # projection, not a fixed per-scan quota. Fundamental/earnings calls no longer
  # draw from this daily counter at all — eps_growth_trend moved to yfinance
  # (see shared/api_clients/fundamental_client.py), so confirmation-only news
  # is the sole remaining consumer of this budget.
  news_cadence: confirmation_only
  post_close: 6
  pre_market: 2
  mid_session: 2
  daily_total: 20
  daily_limit: 25

# Backtesting
backtesting:
  train_split: 0.70
  test_split: 0.30
  min_qualifying_trades: 100
  walk_forward_windows:
    initial_train_months: 18
    initial_validate_months: 6
  performance_review_rolling_window: 20  # trades
  slippage_stock_per_share: 0.02
  slippage_options_bid_ask_pct: 0.50

# Black Swan detector
black_swan:
  smh_drop_threshold_pct: -0.07     # SMH drops >7% in single session
  vix_spike_threshold_pct: 0.40     # VIX spikes >40% intraday
  resume_after_normal_days: 3       # Resume after 3 consecutive normal regime days

# Fundamental analysis layer (weekly batch — does not consume daily AV budget)
fundamental:
  update_cadence: "weekly"
  update_day: "Monday"
  update_time_et: "17:00"
  cache_file: "data/processed/fundamental_state.json"

  # eps_growth_trend (the only figure that used to need Alpha Vantage) now comes
  # from yfinance's earnings-date history instead (shared/api_clients/fundamental_client.py
  # get_eps_growth_trend) — this layer no longer calls Alpha Vantage at all.
  alpha_vantage_calls_per_week: 0

  # Scoring maximums (must sum to 15)
  earnings_momentum_max: 9
  valuation_peers_max: 6

  # Earnings momentum sub-maximums (must sum to 9)
  eps_growth_max: 3
  estimate_revisions_max: 2
  earnings_surprise_max: 2
  analyst_consensus_max: 2

  # Valuation sub-maximums (must sum to 6)
  pe_vs_sector_max: 2
  forward_vs_trailing_pe_max: 2
  ev_ebitda_vs_peers_max: 2

  # Scoring thresholds for EPS growth
  eps_accelerating_threshold: 0.10      # >10% average growth AND accelerating
  eps_positive_threshold: 0.00          # >0% = positive
  eps_flat_threshold: -0.05             # >-5% = flat
  eps_negative_threshold: -0.05         # <-5% = negative contribution

  # Valuation scoring thresholds
  pe_premium_penalty_threshold: 0.50    # 50%+ premium vs sector = -1pt
  pe_extreme_premium_threshold: 1.00    # 100%+ premium = -2pts
  ev_ebitda_premium_threshold: 0.50     # 50%+ above sector average = -1pt
  forward_trailing_tolerance: 0.05      # Within 5% = approximately equal

  # Data quality handling
  unavailable_score: 0                  # Score 0 (neutral) if data unavailable
  suspect_field_score: 0                # Score 0 if field flagged as suspect

# Market Positioning analysis layer — options, institutional ownership, short interest,
# insider transactions, analyst rating trend. Daily cadence (faster-moving than
# Fundamental's weekly batch) — all sourced from free yfinance data, no paid subscription.
positioning:
  update_cadence: "daily"
  cache_file: "data/processed/positioning_state.json"

  # Scoring maximums (must sum to 20)
  options_max: 6
  institutional_max: 5
  short_interest_max: 4
  insider_max: 3
  analyst_max: 2

  # Institutional ownership delta thresholds (fraction of shares outstanding)
  institutional_accumulation_threshold: 0.02   # +2pp -> max bullish score
  institutional_distribution_threshold: -0.02  # -2pp -> max bearish score

  # Short interest trend thresholds (month-over-month change)
  short_interest_declining_threshold: -0.05   # -5%+ -> covering, bullish
  short_interest_increasing_threshold: 0.05   # +5%+ -> building, bearish

  # Analyst rating trend lookback
  analyst_trend_lookback_days: 30

  # Data quality handling
  unavailable_score: 0                  # Sub-signal forfeits its points if data unavailable

# Feedback loop recalibration
feedback_loop:
  recalibrate_every_n_trades: 20
  recalibrate_monthly: true
  weight_change_version_threshold: 0.05  # Changes >5pp require version increment + mini-backtest
  out_of_sample_holdout: 5              # Most recent 5 trades withheld from calibration
  # Per-sector calibrated weights (data/processed/calibrated_weights_by_sector.json,
  # see backtesting/sector_weight_calibration.py) — kill switch, not the primary
  # safety mechanism. A sector only gets its own weights after passing real
  # holdout validation (see that script), same as the global calibration above;
  # this flag exists to let live/paper scoring be reverted to the shared
  # default instantly (e.g. if a sector's weights look off after some real
  # trades come in) without deleting the calibrated file itself.
  sector_calibration_enabled: true

# Signal decay thresholds (daily re-scoring of open positions)
signal_decay:
  early_exit_confidence_drop: 10     # Exit flagged if confidence drops >10 points post-entry
  time_stop_no_progress_pct: 0.30   # Close at Day 10 if <30% of target profit reached
  time_stop_day: 10

# Sentiment analysis
sentiment:
  trajectory_lookback_days: 5
  velocity_window_days: 5
  timezone_windows:
    asian_pre_market_start_et: "18:00"
    asian_pre_market_end_et: "00:00"
    european_start_et: "02:00"
    european_end_et: "09:30"
    us_session_start_et: "09:30"
    us_session_end_et: "16:00"
    us_after_hours_start_et: "16:00"
    us_after_hours_end_et: "18:00"

# News
news:
  decay_halflife_hours: 24           # Decay curve calibrated to the 1-15 day holding period (news
                                      # relevance decay itself is a separate calibration from the
                                      # holding-period bounds — see decay_zero_at_days below, left
                                      # unchanged on purpose when min_days moved 5->1)
  decay_zero_at_days: 5             # News older than 5 trading days effectively zeroed out
  cluster_window_days: 2            # Same-day or adjacent days for clustering
  alpha_vantage_news_function: "NEWS_SENTIMENT"

# Volume profile
volume_profile:
  lookback_days: 60
  price_bucket_pct: 0.005           # 0.5% price buckets for volume node analysis

# Event Severity Gate — binary veto mechanism in the news pipeline (not a scoring
# category). Critical + thesis-opposed news blocks a ticker (or the whole watchlist
# for sector-wide triggers) from surfacing any new signal until the next post-close
# scan completes after the event. See Project_Scope.md "Event Severity Gate".
event_severity_gate:
  enabled: true
  cooling_off: next_post_close_scan   # only supported value for now
  # Sector-scoped: any match blocks only that sector's tickers, not the whole
  # multi-sector watchlist (a chip-ban headline must not block bank tickers,
  # and vice versa). Keyed by watchlist.sectors' sector names.
  sector_triggers:
    semiconductors:
      - "export restriction"
      - "export ban"
      - "chip ban"
      - "tariff"
      - "trade war"
      - "Taiwan Strait"
      - "semiconductor embargo"
      # Hyperscaler capex guidance cuts (see capex_context_tickers above) —
      # a cut is the adverse case worth a caution flag; a capex INCREASE is
      # ordinary bullish news that already flows through normal News scoring
      # and doesn't need a veto-style trigger.
      - "reducing capital expenditures"
      - "lower capex guidance"
      - "cutting data center spending"
      - "scaling back AI infrastructure"
      - "pausing data center"
      - "entity list"
      - "national security review"
    regional_banks:
      - "bank failure"
      - "FDIC receivership"
      - "deposit run"
      - "banking crisis"
      - "SIFI designation"
      - "regional bank contagion"
    healthcare:
      - "FDA rejection"
      - "clinical trial failure"
      - "clinical hold"
      - "drug recall"
      - "black box warning"
      - "manufacturing violation"
      - "safety signal"
      - "patient death"
    consumer_discretionary:
      - "same-store sales miss"
      - "holiday sales miss"
      - "consumer spending slowdown"
      - "guidance cut"
      - "product recall"
      - "boycott"
      - "labor strike"
  ticker_triggers:                     # match + NER ticker attribution => block that ticker (sector-agnostic)
    - "CEO resigns"
    - "CEO departure"
    - "fraud"
    - "SEC investigation"
    - "DOJ investigation"
    - "guidance withdrawn"
    - "accounting irregularities"
    - "restatement"
    - "halted"
  principal_sources:                   # statements from these actors matching any trigger are always critical
    - "President"
    - "White House"
    - "Federal Reserve"
    - "Commerce Department"
    - "USTR"
    - "FDA"
    - "SEC EDGAR"                       # a company's own 8-K filing — always critical if it matches a trigger
  min_source_credibility: 0.5          # below this, trigger match logs WARNING but does not gate
  require_headline_match: true         # case-insensitive match against post-NER headline text

# Technical indicators
technical:
  ma_short: 20
  ma_long: 50
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  rs_lookback: 20
  volume_avg_period: 20
