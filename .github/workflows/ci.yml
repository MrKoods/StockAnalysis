name: CI

on:
  push:
    branches: [main, Version-1]
  pull_request:
    branches: [main, Version-1]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone — check_version_bump.py
          # below diffs against a prior ref, which a depth-1 checkout can't do.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest --cov --cov-report=term-missing

      - name: Enforce version bump on scoring/threshold changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_version_bump.py --base "origin/${{ github.base_ref }}" --head "${{ github.event.pull_request.head.sha }}"
          else
            python scripts/check_version_bump.py --base "HEAD~1" --head "HEAD"
          fi

      - name: Enforce config-key coverage
        run: python scripts/check_config_coverage.py

      - name: Enforce no duplicated confidence-threshold hardcoding
        run: python scripts/check_confidence_threshold_duplication.py

      - name: Enforce all external fetches go through shared/api_clients/
        run: python scripts/check_no_raw_http.py

      # No-ops in CI (rank_trades.csv is untracked); the real value is running
      # this against a live ledger, where the v2.2.100 over-logging bug was
      # invisible from the logs and only existed across runs, in the file.
      - name: Enforce rank-track per-(day, sector) slot budget
        run: python scripts/check_rank_track_slot_budget.py
